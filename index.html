<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1920">
  <title>Poranne TNT</title>
  <link rel="stylesheet" href="css/style.css">
  <!-- Samsung Product API (screensaver control); harmless 404 in a desktop browser. -->
  <script src="$WEBAPIS/webapis/webapis.js"></script>
</head>
<body>

<div id="stage">
  <canvas id="bg" width="1920" height="1080"></canvas>
  <canvas id="fx" width="1920" height="1080"></canvas>

  <div id="hello" class="hello"></div>
  <div id="date" class="date"></div>
  <div id="week" class="week"></div>
  <div id="wx" class="wx hidden"><div class="wx-ico" id="wxIco"></div><div class="wx-t" id="wxT"></div><div class="wx-d" id="wxD"></div></div>

  <div class="big" id="big">
    <div class="lbl" id="lbl"></div>
    <div class="left" id="left"></div>
    <div class="sub" id="sub"></div>
  </div>

  <div class="tasks" id="tasks"></div>
  <div class="go" id="go">Wychodzimy!</div>
  <div class="chal hidden" id="chal"><b>Wyzwanie dnia</b><span id="chalT"></span></div>

  <!-- the firefighter cat with its water bucket; bucket level = morning tasks done -->
  <div id="bucket" class="bucket">
    <svg viewBox="0 0 110 130" width="110" height="130">
      <path d="M8 22h94l-10 104H18z" fill="#c0c6d4"/>
      <polygon id="water" points="0,0" fill="#4aa8ff"/>
      <path d="M8 22h94l-10 104H18z" fill="none" stroke="#7d8496" stroke-width="5"/>
      <path d="M14 60h82M17 96h76" stroke="#7d8496" stroke-width="3" opacity="0.6"/>
      <ellipse cx="55" cy="22" rx="47" ry="8" fill="none" stroke="#9aa1b2" stroke-width="5"/>
      <path d="M12 26Q55 -24 98 26" fill="none" stroke="#7d8496" stroke-width="4"/>
    </svg>
  </div>
  <div id="cat" class="cat">
    <svg viewBox="0 0 220 280" width="220" height="280">
      <g><animateTransform attributeName="transform" type="rotate" values="-10 160 238;12 160 238;-10 160 238" dur="1.8s" repeatCount="indefinite"/>
        <path d="M160 238Q214 232 206 176Q200 146 180 156" stroke="#e8862a" stroke-width="20" fill="none" stroke-linecap="round"/></g>
      <!-- clothes follow the kid's ticked tasks: pyjamas -> coat (ubranie), boots (buty), helmet (kurtka) -->
      <g class="pj"><ellipse cx="110" cy="212" rx="62" ry="62" fill="#8fb8ff"/>
        <g fill="#fff" opacity="0.8"><circle cx="80" cy="190" r="5"/><circle cx="132" cy="182" r="5"/><circle cx="100" cy="232" r="5"/>
          <circle cx="146" cy="226" r="5"/><circle cx="74" cy="242" r="5"/><circle cx="122" cy="256" r="5"/><circle cx="108" cy="198" r="5"/></g>
        <path d="M80 158l30 18 30-18" stroke="#fff" stroke-width="6" fill="none"/></g>
      <g class="coat"><ellipse cx="110" cy="212" rx="62" ry="62" fill="#c9a227"/>
        <path d="M50 226h120" stroke="#e8f0ff" stroke-width="12"/>
        <path d="M110 154v120" stroke="#8a6d12" stroke-width="4"/></g>
      <g class="paws"><ellipse cx="82" cy="270" rx="26" ry="12" fill="#f29b38"/><ellipse cx="138" cy="270" rx="26" ry="12" fill="#f29b38"/></g>
      <g class="boots"><rect x="56" y="242" width="48" height="36" rx="9" fill="#2b2b33"/><rect x="116" y="242" width="48" height="36" rx="9" fill="#2b2b33"/>
        <rect x="56" y="254" width="48" height="7" fill="#ffd54a"/><rect x="116" y="254" width="48" height="7" fill="#ffd54a"/></g>
      <g class="teddy"><circle cx="178" cy="168" r="8" fill="#b87a45"/><circle cx="202" cy="168" r="8" fill="#b87a45"/>
        <ellipse cx="190" cy="206" rx="17" ry="19" fill="#b87a45"/><circle cx="190" cy="180" r="15" fill="#c4874f"/>
        <ellipse cx="190" cy="186" rx="6" ry="4" fill="#e8c39e"/><circle cx="185" cy="177" r="2" fill="#2b1a0e"/><circle cx="195" cy="177" r="2" fill="#2b1a0e"/></g>
      <circle cx="170" cy="204" r="17" fill="#f29b38"/>
      <path d="M48 70L32 18L80 46Z" fill="#f29b38"/><path d="M172 70L188 18L140 46Z" fill="#f29b38"/>
      <path d="M50 60L42 32L68 48Z" fill="#ffb3c4"/><path d="M170 60L178 32L152 48Z" fill="#ffb3c4"/>
      <ellipse cx="110" cy="104" rx="66" ry="56" fill="#f29b38"/>
      <ellipse cx="110" cy="128" rx="32" ry="21" fill="#ffe2bf"/>
      <ellipse cx="66" cy="124" rx="12" ry="7" fill="#ff8a7a" opacity="0.5"/><ellipse cx="154" cy="124" rx="12" ry="7" fill="#ff8a7a" opacity="0.5"/>
      <g class="eyesOpen">
        <ellipse cx="86" cy="100" rx="12" ry="14" fill="#fff"/><ellipse cx="134" cy="100" rx="12" ry="14" fill="#fff"/>
        <circle cx="88" cy="102" r="8" fill="#1d2b1a"/><circle cx="132" cy="102" r="8" fill="#1d2b1a"/>
        <circle cx="91" cy="98" r="3" fill="#fff"/><circle cx="135" cy="98" r="3" fill="#fff"/>
        <ellipse cx="86" cy="100" rx="13" ry="0" fill="#f29b38"><animate attributeName="ry" values="0;0;15;0" keyTimes="0;0.9;0.95;1" dur="4.5s" repeatCount="indefinite"/></ellipse>
        <ellipse cx="134" cy="100" rx="13" ry="0" fill="#f29b38"><animate attributeName="ry" values="0;0;15;0" keyTimes="0;0.9;0.95;1" dur="4.5s" repeatCount="indefinite"/></ellipse>
      </g>
      <g class="eyesShut"><path d="M74 102q12 9 24 0M122 102q12 9 24 0" stroke="#5a2a08" stroke-width="5" fill="none" stroke-linecap="round"/></g>
      <path d="M103 117h14l-7 8z" fill="#ff7a9a"/>
      <path d="M110 125q-6 10-14 4M110 125q6 10 14 4" stroke="#7a3b10" stroke-width="3" fill="none" stroke-linecap="round"/>
      <path d="M82 128l-34-4M82 134l-32 6M138 128l34-4M138 134l32 6" stroke="#fff" stroke-width="2.5" stroke-linecap="round"/>
      <g class="soot" fill="#2a2522" opacity="0.75">
        <ellipse cx="70" cy="80" rx="18" ry="12"/><ellipse cx="150" cy="140" rx="20" ry="12"/><ellipse cx="120" cy="70" rx="14" ry="9"/>
        <ellipse cx="90" cy="200" rx="24" ry="16"/><ellipse cx="140" cy="240" rx="18" ry="10"/>
      </g>
      <g class="grin"><path d="M100 129h20v5q-10 6-20 0z" fill="#fff"/><path d="M134 128l3 7 7 3-7 3-3 7-3-7-7-3 7-3z" fill="#fff"/></g>
      <g class="scarf"><path d="M60 148q50 20 100 0v16q-50 20-100 0z" fill="#e53950"/><path d="M70 160l-8 44 18 2 6-42z" fill="#e53950"/>
        <path d="M80 154v16M100 158v16M120 158v16M140 154v16" stroke="#fff" stroke-width="5"/></g>
      <g class="nightcap"><path d="M48 78Q52 20 110 18Q160 18 176 56Q190 84 200 112" stroke="#6f8fe0" stroke-width="2" fill="#6f8fe0"/>
        <path d="M48 78Q110 50 176 70L200 112Q170 70 110 70Q70 70 48 78z" fill="#6f8fe0"/>
        <circle cx="202" cy="118" r="13" fill="#fff"/><path d="M42 84Q110 62 180 82" stroke="#fff" stroke-width="12" fill="none" stroke-linecap="round"/></g>
      <g class="helmet"><path d="M48 76Q52 16 110 14Q168 16 172 76Z" fill="#d32f2f"/>
        <path d="M110 16V72" stroke="#ff6a6a" stroke-width="9"/>
        <path d="M34 80Q110 60 186 80Q192 92 178 90Q110 76 42 90Q28 92 34 80Z" fill="#a51818"/>
        <path d="M98 38h24v14q-12 10-24 0z" fill="#ffd54a"/></g>
      <g transform="rotate(-38 40 170)"><rect x="32" y="118" width="16" height="54" rx="5" fill="#3a3a44"/><rect x="30" y="112" width="20" height="12" rx="3" fill="#ffd54a"/></g>
      <circle cx="44" cy="180" r="18" fill="#f29b38"/>
      <!-- the cat does each task for ~3 s right after the kid ticks it -->
      <g class="act a-siku"><path d="M54 252h112l-12 28H66z" fill="#4aa8ff"/><ellipse cx="110" cy="252" rx="56" ry="10" fill="#2f80d0"/>
        <rect x="160" y="186" width="28" height="32" rx="6" fill="#fff"/><ellipse cx="174" cy="187" rx="14" ry="5" fill="#ccc"/></g>
      <g class="act a-sniadanie"><path d="M70 160h80q-4 34-40 36q-36-2-40-36z" fill="#ffb347"/><ellipse cx="110" cy="160" rx="40" ry="9" fill="#fff3d6"/>
        <g><animateTransform attributeName="transform" type="translate" values="0 0;-24 -16;0 0" dur="0.9s" repeatCount="indefinite"/>
          <rect x="140" y="146" width="8" height="40" rx="4" fill="#d9d9d9" transform="rotate(35 144 166)"/><ellipse cx="134" cy="146" rx="10" ry="6" fill="#d9d9d9"/></g></g>
      <g class="act a-zeby"><g><animateTransform attributeName="transform" type="translate" values="-8 0;8 0;-8 0" dur="0.3s" repeatCount="indefinite"/>
          <rect x="106" y="129" width="68" height="9" rx="4" fill="#4fd1c5"/><rect x="96" y="122" width="18" height="10" rx="2" fill="#fff"/></g>
        <g fill="#fff"><circle cx="90" cy="140" r="6"/><circle cx="100" cy="147" r="4"/><circle cx="84" cy="131" r="4"/><circle cx="128" cy="146" r="4"/></g></g>
      <g class="act a-puff" fill="#fff59d"><animate attributeName="opacity" values="1;0.2;1" dur="0.5s" repeatCount="indefinite"/>
        <path d="M30 140l4 10 10 4-10 4-4 10-4-10-10-4 10-4z"/><path d="M190 110l4 10 10 4-10 4-4 10-4-10-10-4 10-4z"/>
        <path d="M24 236l4 10 10 4-10 4-4 10-4-10-10-4 10-4z"/><path d="M200 232l4 10 10 4-10 4-4 10-4-10-10-4 10-4z"/>
        <path d="M110 0l4 10 10 4-10 4-4 10-4-10-10-4 10-4z"/></g>
    </svg>
  </div>
  <div id="bubble" class="bubble"><span id="bubbleT"></span></div>

  <div class="bum" id="bum">BUM!</div>
  <div class="foot" id="foot"></div>
</div>

<div id="settings" class="settings">
  <div class="s-box">
    <div class="s-title">Ustawienia</div>
    <div id="sRows"></div>
    <input id="nameInput" type="text" autocomplete="off">
    <div class="s-hint">▲▼ wybierz · ◄► zmień · ↩ zamknij</div>
  </div>
</div>

<div id="toast" class="toast"></div>

<script src="js/sound.js"></script>
<script src="js/props.js"></script>
<script src="js/weather.js"></script>
<script src="js/game.js"></script>
</body>
</html>
